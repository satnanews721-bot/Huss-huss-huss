<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huss Huss Huss</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #090a1a, #25205b 55%, #5b2b79);
    }
    .panel {
      width: min(90%, 720px);
      padding: 56px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 28px;
      background: rgba(255,255,255,.09);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 10vw, 6rem);
      letter-spacing: .04em;
      text-shadow: 0 0 28px rgba(180,160,255,.65);
    }
    .spark { margin-top: 20px; font-size: 1.5rem; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>huss huss huss</h1>
    <div class="spark">✦ ✨ ✦</div>
  </main>
</body>
</html>
